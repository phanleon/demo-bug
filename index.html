<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamborghini | Luxury Cars</title>
    
    <!-- Font chữ sang trọng -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Link file CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================
         HEADER / NAVBAR
    ========================================== -->
    <header class="navbar">
        <a href="index.html" class="logo">LAMBORGHINI</a>
        <nav>
            <a href="#models" id="models-link">Models</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
            <span id="user-nav">
                <a href="auth.html">ACCOUNT</a>
            </span>
        </nav>
    </header>

    <!-- =========================================
         HERO SECTION (Màn hình chính)
    ========================================== -->
    <section class="hero">
        <div class="hero-bg">
            <img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?q=80&w=2071" alt="Lambo Background">
        </div>
        
        <div class="hero-content">
            <h1 class="title">AVENTADOR SVJ</h1>
            <p class="subtitle">REAL EMOTIONS SHAPE THE FUTURE</p>
            <div class="hero-btns">
                <button class="btn-luxury" onclick="window.location.href='detail.html?id=aventador-svj'">KHÁM PHÁ NGAY</button>
                <button class="btn-luxury btn-sound" onclick="playEngineRev()">🔊 REV V12 SOUND</button>
            </div>
        </div>
    </section>

    <!-- =========================================
         MODELS SECTION (Danh sách siêu xe)
    ========================================== -->
    <section id="models" class="models-section">
        <div class="models-heading">
            <p class="section-eyebrow">LAMBORGHINI COLLECTION</p>
            <h2>CÁC DÒNG XE</h2>
            <p class="models-description">Khám phá những mẫu siêu xe huyền thoại đỉnh cao công nghệ của Lamborghini.</p>
        </div>
        <div id="models-grid" class="models-grid"></div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-logo">LAMBORGHINI VIP CLUB</p>
            <p class="copyright">© 2026 Automobili Lamborghini S.p.A. All rights reserved.</p>
        </div>
    </footer>

    <!-- Các thư viện JS tạo hiệu ứng -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <script src="js/main.js"></script>

    <!-- Script tự động hiển thị tên tài khoản VIP & Đăng xuất -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userNav = document.getElementById('user-nav');
            const currentUser = JSON.parse(localStorage.getItem('lambo_logged_in'));

            if (currentUser && currentUser.username) {
                userNav.innerHTML = `
                    <span style="color: #d4af37; margin-right: 12px; font-size: 13px; letter-spacing: 1px; font-weight: 600;">
                        VIP: ${currentUser.username.toUpperCase()}
                    </span>
                    <a href="#" style="color: #888; text-decoration: none; font-size: 12px; letter-spacing: 1px; transition: color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#888'" onclick="handleLogout(event)">LOGOUT</a>
                `;
            }
        });

        function handleLogout(e) {
            e.preventDefault();
            if (confirm('Bạn có chắc chắn muốn đăng xuất khỏi tài khoản VIP?')) {
                localStorage.removeItem('lambo_logged_in');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
